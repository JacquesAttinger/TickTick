# XcodeGen spec. Run `make gen` to create TickTick.xcodeproj (it is generated, never committed).
name: TickTick

options:
  bundleIdPrefix: com.jacquesattinger
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: DFRDL2XPKG
    CODE_SIGN_STYLE: Automatic

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.0.0

targets:
  TickTick:
    type: application
    platform: macOS
    sources:
      - path: TickTick
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacquesattinger.TickTick
        INFOPLIST_FILE: TickTick/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TickTick/Resources/TickTick.entitlements
    dependencies:
      - package: KeyboardShortcuts
    scheme:
      testTargets:
        - TickTickTests

  TickTickTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TickTickTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacquesattinger.TickTickTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TickTick
